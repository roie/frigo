name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Runtime (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Check formatting
        if: matrix.os == 'ubuntu-latest'
        run: test -z "$(gofmt -l $(git ls-files '*.go'))"

      - name: Vet
        if: matrix.os == 'ubuntu-latest'
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Package smoke test
        if: matrix.os == 'ubuntu-latest'
        run: bash scripts/package_test.sh

  race:
    name: Race (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Race test
        run: go test -race ./...

  compatibility:
    name: Git 2.23 Compatibility
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Build Git 2.23.0
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gettext libcurl4-gnutls-dev libexpat1-dev libssl-dev zlib1g-dev perl
          prefix="$RUNNER_TEMP/git-2.23.0"
          tarball="$RUNNER_TEMP/git-2.23.0.tar.gz"
          curl -L https://mirrors.edge.kernel.org/pub/software/scm/git/git-2.23.0.tar.gz -o "$tarball"
          tar -C "$RUNNER_TEMP" -xzf "$tarball"
          cd "$RUNNER_TEMP/git-2.23.0"
          make configure
          ./configure --prefix="$prefix"
          make -j"$(nproc)" prefix="$prefix" NO_GETTEXT=YesPlease NO_TCLTK=YesPlease all
          make prefix="$prefix" NO_GETTEXT=YesPlease NO_TCLTK=YesPlease install
          echo "$prefix/bin" >> "$GITHUB_PATH"

      - name: Verify Git 2.23.0
        run: test "$(git --version)" = "git version 2.23.0"

      - name: Run Git 2.23 compatibility tests
        env:
          GOFLAGS: -mod=readonly
        run: go test ./internal/frigo -run '^TestPrivateAttributesPreserveBytesAndDiff$|^TestCommitRejectsStaleHistoryBase$|^TestConcurrentUnbornCommit$|^TestCommitRejectsHistoryBaseDeletedConcurrently$' -count=1

  release:
    name: Publish
    needs: [verify, race, compatibility]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Build package binaries
        env:
          GOFLAGS: -mod=readonly
          VERSION: ${{ github.ref_name }}
        run: |
          version="${VERSION#v}"
          ldflags="-s -w -X github.com/roie/frigo/internal/cli.version=${version}"
          mkdir -p vendor/linux-x64 vendor/linux-arm64 vendor/win32-x64 vendor/win32-arm64 vendor/darwin-x64 vendor/darwin-arm64
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "$ldflags" -o vendor/linux-x64/frigo ./cmd/frigo
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -ldflags "$ldflags" -o vendor/linux-arm64/frigo ./cmd/frigo
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "$ldflags" -o vendor/win32-x64/frigo.exe ./cmd/frigo
          GOOS=windows GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -ldflags "$ldflags" -o vendor/win32-arm64/frigo.exe ./cmd/frigo
          GOOS=darwin GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "$ldflags" -o vendor/darwin-x64/frigo ./cmd/frigo
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -ldflags "$ldflags" -o vendor/darwin-arm64/frigo ./cmd/frigo

      - name: Generate npm package files
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          version="${VERSION#v}"
          scripts/build-npm-package.sh "$version" "$PWD"

      - name: Pack and smoke test npm package
        id: pack
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          version="${VERSION#v}"
          tarball="$(npm pack)"
          echo "tarball=${tarball}" >> "$GITHUB_OUTPUT"
          install_dir="$(mktemp -d)"
          npm install --prefix "$install_dir" "$tarball"
          frigo_bin="$install_dir/node_modules/.bin/frigo"
          test "$("$frigo_bin" --version)" = "frigo ${version}"
          test -f "$install_dir/node_modules/frigo/vendor/linux-x64/frigo"
          test -f "$install_dir/node_modules/frigo/vendor/linux-arm64/frigo"
          test -f "$install_dir/node_modules/frigo/vendor/win32-x64/frigo.exe"
          test -f "$install_dir/node_modules/frigo/vendor/win32-arm64/frigo.exe"
          test -f "$install_dir/node_modules/frigo/vendor/darwin-x64/frigo"
          test -f "$install_dir/node_modules/frigo/vendor/darwin-arm64/frigo"
          test -f "$install_dir/node_modules/frigo/LICENSE"

      - name: Publish npm package
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: npm publish "$TARBALL" --access public

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$RELEASE_TAG"
          --title "$RELEASE_TAG"
          --generate-notes
