name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Runtime (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Check formatting
        if: matrix.os == 'ubuntu-latest'
        run: test -z "$(gofmt -l $(git ls-files '*.go'))"

      - name: Vet
        if: matrix.os == 'ubuntu-latest'
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Package smoke test
        if: matrix.os == 'ubuntu-latest'
        run: bash scripts/package_test.sh

  race:
    name: Race (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Race test
        run: go test -race ./...

  compatibility:
    name: Git 2.23 Compatibility
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Build Git 2.23.0
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gettext libcurl4-gnutls-dev libexpat1-dev libssl-dev zlib1g-dev perl
          prefix="$RUNNER_TEMP/git-2.23.0"
          tarball="$RUNNER_TEMP/git-2.23.0.tar.gz"
          curl -L https://mirrors.edge.kernel.org/pub/software/scm/git/git-2.23.0.tar.gz -o "$tarball"
          tar -C "$RUNNER_TEMP" -xzf "$tarball"
          cd "$RUNNER_TEMP/git-2.23.0"
          make configure
          ./configure --prefix="$prefix"
          make -j"$(nproc)" prefix="$prefix" NO_GETTEXT=YesPlease NO_TCLTK=YesPlease all
          make prefix="$prefix" NO_GETTEXT=YesPlease NO_TCLTK=YesPlease install
          echo "$prefix/bin" >> "$GITHUB_PATH"

      - name: Verify Git 2.23.0
        run: test "$(git --version)" = "git version 2.23.0"

      - name: Run Git 2.23 compatibility tests
        env:
          GOFLAGS: -mod=readonly
        run: go test ./internal/frigo -run '^TestPrivateAttributesPreserveBytesAndDiff$|^TestCommitRejectsStaleHistoryBase$|^TestConcurrentUnbornCommit$|^TestCommitRejectsHistoryBaseDeletedConcurrently$' -count=1

  release:
    name: Publish
    needs: [verify, race, compatibility]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Build package binaries
        env:
          GOFLAGS: -mod=readonly
          VERSION: ${{ github.ref_name }}
        run: |
          version="${VERSION#v}"
          ldflags="-s -w -X github.com/roie/frigo/internal/cli.version=${version}"
          mkdir -p vendor/linux-x64 vendor/linux-arm64 vendor/win32-x64 vendor/win32-arm64 vendor/darwin-x64 vendor/darwin-arm64 release-assets
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "$ldflags" -o vendor/linux-x64/frigo ./cmd/frigo
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -ldflags "$ldflags" -o vendor/linux-arm64/frigo ./cmd/frigo
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "$ldflags" -o vendor/win32-x64/frigo.exe ./cmd/frigo
          GOOS=windows GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -ldflags "$ldflags" -o vendor/win32-arm64/frigo.exe ./cmd/frigo
          GOOS=darwin GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "$ldflags" -o vendor/darwin-x64/frigo ./cmd/frigo
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -ldflags "$ldflags" -o vendor/darwin-arm64/frigo ./cmd/frigo
          node scripts/build-release-assets.js "$PWD/vendor" "$PWD/release-assets"

      - name: Verify release manifest
        run: node scripts/build-release-assets.js --verify-manifest "$PWD/release-assets/checksums.json"

      - name: Generate npm package files
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          version="${VERSION#v}"
          scripts/build-npm-package.sh "$version" "$PWD/npm-dist" "$PWD/release-assets/checksums.json"

      - name: Pack npm package
        id: pack
        run: |
          cd npm-dist
          tarball="$(npm pack --silent)"
          echo "tarball=${tarball}" >> "$GITHUB_OUTPUT"

      - name: Smoke test packed npm package
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
          VERSION: ${{ github.ref_name }}
        run: bash scripts/package_test.sh "${VERSION#v}" "$PWD/npm-dist/$TARBALL" "$PWD/release-assets"

      - name: Prepare GitHub release
        id: github_release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if release_state=$(gh release view "$RELEASE_TAG" --json isDraft,isImmutable --jq '[.isDraft, .isImmutable] | @tsv' 2>/dev/null); then
            read -r is_draft is_immutable <<<"$release_state"
          else
            gh release create "$RELEASE_TAG" --draft --generate-notes --verify-tag
            is_draft=true
            is_immutable=false
          fi
          echo "is_draft=${is_draft}" >> "$GITHUB_OUTPUT"
          echo "is_immutable=${is_immutable}" >> "$GITHUB_OUTPUT"

      - name: Upload draft release assets
        if: steps.github_release.outputs.is_draft == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release upload "$RELEASE_TAG" release-assets/* --clobber

      - name: Compare GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          download_dir="$RUNNER_TEMP/frigo-release-assets"
          rm -rf "$download_dir"
          mkdir -p "$download_dir"
          gh release download "$RELEASE_TAG" --dir "$download_dir" --clobber
          shopt -s nullglob
          local_assets=(release-assets/*)
          remote_assets=("$download_dir"/*)
          test "${#local_assets[@]}" -eq "${#remote_assets[@]}"
          for local_asset in "${local_assets[@]}"; do
            remote_asset="$download_dir/${local_asset##*/}"
            test -f "$remote_asset"
            cmp "$local_asset" "$remote_asset"
          done

      - name: Publish GitHub release
        if: steps.github_release.outputs.is_draft == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release edit "$RELEASE_TAG" --draft=false

      - name: Verify public release assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/verify-release-assets.js "$RELEASE_TAG" "roie/frigo" "$PWD/release-assets/checksums.json"

      - name: Publish npm package
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
          VERSION: ${{ github.ref_name }}
        run: |
          version="${VERSION#v}"
          if published=$(npm view "frigo@${version}" version 2>/dev/null) && [ "$published" = "$version" ]; then
            echo "frigo@${version} is already published"
          else
            npm publish "npm-dist/$TARBALL" --access public --provenance
          fi

  release-smoke:
    name: Registry smoke test
    needs: release
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Smoke test npm install and npx
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          version="${VERSION#v}"
          installed=false
          for attempt in 1 2 3 4 5; do
            if npm install -g "frigo@${version}"; then
              installed=true
              break
            fi
            sleep "$((attempt * 5))"
          done
          test "$installed" = true
          test "$(FRIGO_CACHE_DIR="$RUNNER_TEMP/frigo-global-cache" frigo --version)" = "frigo ${version}"
          test "$(FRIGO_CACHE_DIR="$RUNNER_TEMP/frigo-npx-cache" npx --yes "frigo@${version}" --version)" = "frigo ${version}"

      - name: Remove global package
        if: always()
        shell: bash
        run: npm uninstall -g frigo || true
